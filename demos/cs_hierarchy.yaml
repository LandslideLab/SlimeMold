# SlimeMold DSL spec
name: customer-service-hierarchy
sim:
  turns: 120
  seed: 42
organization:
  name: cs-hierarchy
  roles:
    -
      id: lead
      name: 'Team Lead'
      capabilities:
        - review
      autonomy: approver
    -
      id: agent1
      name: 'CS Agent 1'
      capabilities:
        - t1
        - t2
      autonomy: collaborator
    -
      id: agent2
      name: 'CS Agent 2'
      capabilities:
        - t1
        - t3
      autonomy: collaborator
  reporting:
    agent1: lead
    agent2: lead
institution:
  delegation_strategy: controlled
  supervision_budget:
    lead: 3
  approval_gates:
    -
      kind: risk
      threshold: 0.7
  escalation_timeout: 6
  max_wait_turns: 15
taskflow:
  arrival_rate: 1.4
  task_types:
    - t1
    - t2
    - t3
  complexity_mu: 0.45
  risk_mu: 0.35
  dynamism: 0.01
  anomaly_probability: 0.03
  novelty_probability: 0.05
knowledge:
  sharing_probability: 0.7
  half_life: 50.0
  revalidation_probability: 0.12
turnover:
  per_turn_probability: 0.002
